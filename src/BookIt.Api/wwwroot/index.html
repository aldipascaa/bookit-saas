<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BookIt - Booking &amp; Invoicing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">&#10003;</span> BookIt</div>
    <nav id="nav" aria-label="Main" hidden>
      <button class="tab-btn" data-tab="services" aria-current="page">Services</button>
      <button class="tab-btn" data-tab="bookings">My bookings</button>
      <button class="tab-btn" data-tab="invoices">Invoices</button>
    </nav>
    <div id="account" class="account" hidden>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="who" id="who"></span>
      <button id="logout" class="btn ghost sm">Log out</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="auth" aria-labelledby="auth-title">
      <div class="card auth-card">
        <h1 id="auth-title">Welcome back</h1>
        <p class="muted" id="auth-sub">Log in to manage your bookings and invoices.</p>
        <form id="auth-form" novalidate>
          <div class="field" id="name-row" hidden>
            <label for="fullName">Full name</label>
            <input id="fullName" autocomplete="name">
            <p class="err" id="fullName-err" role="alert"></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required value="demo@bookit.test">
            <p class="err" id="email-err" role="alert"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required minlength="8" value="Demo#12345">
            <p class="err" id="password-err" role="alert"></p>
          </div>
          <button type="submit" class="btn block" id="auth-submit">Log in</button>
        </form>
        <p class="switch"><button type="button" class="link" id="toggle-auth">Need an account? Register</button></p>
        <p class="muted small hint">Demo login is pre-filled (demo@bookit.test).</p>
      </div>
    </section>

    <section id="tab-services" class="tab" hidden aria-labelledby="h-services">
      <div class="page-head"><h1 id="h-services">Services</h1><p class="muted">Pick a service and choose a time.</p></div>
      <div id="services" class="grid" aria-live="polite"></div>
    </section>

    <section id="tab-bookings" class="tab" hidden aria-labelledby="h-bookings">
      <div class="page-head"><h1 id="h-bookings">My bookings</h1><p class="muted">Upcoming and past appointments.</p></div>
      <div id="bookings" class="list" aria-live="polite"></div>
    </section>

    <section id="tab-invoices" class="tab" hidden aria-labelledby="h-invoices">
      <div class="page-head"><h1 id="h-invoices">Invoices</h1><p class="muted">Review and pay your invoices.</p></div>
      <div id="invoices" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="book-dialog" aria-labelledby="book-title">
    <form id="book-form" novalidate>
      <h2 id="book-title">Book a service</h2>
      <p class="muted" id="book-summary"></p>
      <div class="field">
        <label for="book-start">Date and time (your local time)</label>
        <input id="book-start" type="datetime-local" step="900" required>
        <p class="hint-line" id="book-end"></p>
        <p class="err" id="book-start-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="book-notes">Notes (optional)</label>
        <input id="book-notes" maxlength="200">
      </div>
      <p class="err form-err" id="book-form-err" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="book-cancel">Close</button>
        <button type="submit" class="btn" id="book-submit">Confirm booking</button>
      </div>
    </form>
  </dialog>

  <dialog id="inv-dialog" aria-labelledby="inv-title">
    <div id="inv-body"></div>
  </dialog>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <script src="app.js"></script>
</body>
</html>
